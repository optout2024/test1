<ul class="menu">
    {% for test1 in site.data.menu %}
    {% if test1.subcategories != null %}
    <li><a href="{{ test1.href }}" class="page-link">{{ test1.title }}</a>
    <ul class="sub-menu">
    {% for subcategory in test1.subcategories %}
    <li><a href="{{ subcategory.subhref }}">{{ subcategory.subtitle }}</a></li>
    {% endfor %}
    </ul>
    {% else %}
     <li><a href="{{ test1.href }}" class="page-link">{{ test1.title }}</a>
    {% endif %}
    </li>
    {% endfor %}
    </ul>
